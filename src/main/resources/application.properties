spring.application.name=bodybuddy

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bodybuddy_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
bodybuddy.image-storage.root=${UPLOAD_PATH:uploads}
bodybuddy.food-recognition.provider=${FOOD_RECOGNITION_PROVIDER:fake}
bodybuddy.food-recognition.minimum-confidence=${FOOD_RECOGNITION_MIN_CONFIDENCE:0.60}
bodybuddy.openai.api-key=${OPENAI_API_KEY:}
bodybuddy.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com}
bodybuddy.openai.connect-timeout=${OPENAI_CONNECT_TIMEOUT:5s}
bodybuddy.openai.read-timeout=${OPENAI_READ_TIMEOUT:45s}
bodybuddy.openai.food-recognition.model=${OPENAI_FOOD_RECOGNITION_MODEL:gpt-5-mini-2025-08-07}
bodybuddy.openai.food-recognition.prompt-version=food-recognition-v2
bodybuddy.openai.food-recognition.max-output-tokens=600
bodybuddy.openai.food-recognition.image-detail=${OPENAI_IMAGE_DETAIL:auto}
bodybuddy.food-nutrition-estimation.provider=${FOOD_NUTRITION_ESTIMATION_PROVIDER:${FOOD_RECOGNITION_PROVIDER:fake}}
bodybuddy.openai.food-nutrition-estimation.model=${OPENAI_FOOD_NUTRITION_MODEL:gpt-5-mini-2025-08-07}
bodybuddy.openai.food-nutrition-estimation.prompt-version=food-nutrition-estimation-v1
bodybuddy.openai.food-nutrition-estimation.max-output-tokens=500
bodybuddy.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
spring.jpa.open-in-view=false
